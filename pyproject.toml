[project]
name = "yfdataextract"
version = "0.1.0"
description = "Extraction de toutes les données disponibles sur Yahoo Finance (prix, fondamentaux, analystes, détenteurs, options, fonds, screeners, calendriers)"
readme = "README.md"
authors = [
    { name = "Alban Sarfati", email = "albansarfati@gmail.com" }
]
requires-python = ">=3.12"
classifiers = ["Programming Language :: Python :: 3.12"]
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "streamlit>=1.66.1",
    "yfinance>=1.7.0",
]

[project.scripts]
yfdx = "yfdataextract.cli:main"
yfdx-app = "yfdataextract.app_launcher:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
